name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Node syntax
        run: |
          node --check server.js
          node --check public/app.js

      - name: Verify project files
        run: |
          test -f README.md
          test -f .env.example
          test -f .gitignore
          test -f prompts/app-system-prompt.md
          test -f prompts/app-user-prompt.md
