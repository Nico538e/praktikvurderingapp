name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify Node syntax
        run: |
          node --check server.js
          node --check public/app.js

      - name: Verify project files
        run: |
          test -f README.md
          test -f .env.example
          test -f .gitignore
          test -f prompts/app-system-prompt.md
          test -f prompts/app-user-prompt.md

